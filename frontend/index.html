<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="theme-color" content="#e65c00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Unregister any stale service workers so updated code is always served -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var unregistered = 0;
          registrations.forEach(function(reg) { reg.unregister(); unregistered++; });
          if (unregistered > 0 && !sessionStorage.getItem('sw-cleared')) {
            sessionStorage.setItem('sw-cleared', '1');
            window.location.reload();
          }
        });
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
